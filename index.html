<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D2135">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coparent">
<title>Coparentalité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--bg:#1D2135;--card:#282D45;--card2:#343A56;--ink:#EEF0FA;--mut:#A9AFCB;--line:#343A56;--acc:#C4B5FD;--r:20px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 16px) 20px 10px;display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto}
header .sub{font-size:13px;color:var(--mut);font-weight:600}
header h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.01em}
.me{border:0;background:var(--card);border-radius:50%;width:46px;height:46px;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.me[data-sync]:not([data-sync=""])::after{content:"";position:absolute;right:1px;bottom:1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:#86EFAC}
.me[data-sync=err]::after{background:#FCA5A5}
.me[data-sync=busy]::after{background:#FDE68A;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
main{padding:0 20px calc(120px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:532px;margin:0 auto;background:var(--card2);border-radius:99px;display:flex;gap:2px;padding:6px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.35)}
nav button{flex:1;min-width:0;overflow:hidden;white-space:nowrap;border:0;background:none;height:50px;border-radius:99px;font:inherit;font-size:13px;font-weight:800;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:flex .38s cubic-bezier(.4,0,.2,1),color .25s}
nav button svg{flex:none}
nav button span{display:none}
nav button.on{flex:2.4;color:var(--bg)}
nav button.on span{display:inline;animation:fadein .38s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* indicateur glissant commun (barre du bas, enfants, sélecteurs côte à côte) */
.slider{position:relative}
nav.slider{position:fixed}
.slider>.ind{position:absolute;z-index:0;border-radius:99px;background:var(--ink);pointer-events:none;transition:left .42s cubic-bezier(.34,1.32,.5,1),top .42s cubic-bezier(.34,1.32,.5,1),width .42s cubic-bezier(.34,1.32,.5,1),height .42s cubic-bezier(.34,1.32,.5,1),opacity .2s}
nav.slider>.ind{transition:left .38s cubic-bezier(.4,0,.2,1),width .38s cubic-bezier(.4,0,.2,1)}
.slider>:not(.ind){position:relative;z-index:1}
.slider>.on{background:transparent!important}
.chip,.seg button{transition:color .25s}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.big{font-size:22px;font-weight:800}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);color:var(--ink)}
.pill.ok{background:rgba(134,239,172,.18);color:#86EFAC}
.pill.wait{background:rgba(253,186,116,.18);color:#FDBA74}
.btn{border:0;border-radius:99px;padding:12px 16px;font:inherit;font-weight:800;background:var(--ink);color:var(--bg);cursor:pointer}
.btn.sec{background:var(--card2);color:var(--ink)}
.btn.dan{background:rgba(248,113,113,.18);color:#FCA5A5}
.btn.full{width:100%;margin-top:10px}
.btn.sm{padding:7px 12px;font-size:13px}
.icon{border:0;background:var(--card);color:var(--ink);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab{position:fixed;right:22px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;border:0;background:var(--ink);color:var(--bg);box-shadow:0 8px 20px rgba(0,0,0,.35);z-index:9;cursor:pointer}
h2{font-size:13px;margin:22px 0 4px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:pan-y}
.cal .h{font-size:11px;color:var(--mut);text-align:center;padding:4px 0;font-weight:700}
.d{background:var(--card);border-radius:12px;min-height:56px;padding:6px 7px;position:relative;font:inherit;font-size:14px;font-weight:700;border:0;text-align:left;color:var(--ink);cursor:pointer}
.d.out{opacity:.3}
.d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.d .bar{position:absolute;left:6px;right:6px;bottom:6px;height:5px;border-radius:3px}
.d .bar.chg{background-image:repeating-linear-gradient(45deg,rgba(29,33,53,.55) 0 2px,transparent 2px 5px)}
.d .dots{position:absolute;right:6px;top:9px;display:flex;gap:2px}
.d .dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
.legend span{display:flex;align-items:center;gap:6px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.thumb{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none}
.hero{border-radius:24px;padding:18px;color:#1D2135;margin:8px 0 12px;display:flex;align-items:center;gap:14px}
.hero .k{font-size:13px;font-weight:700;opacity:.75}
.hero .big{line-height:1.15}
.week{display:flex;gap:2px}
.week button{flex:1;position:relative;border:0;background:none;font:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:14px;font-size:11px;color:var(--mut);font-weight:700;cursor:pointer;transition:background .2s,transform .15s}
.week button:active{transform:scale(.92);background:var(--card2)}
.week button.on{background:var(--card2)}
.week button b{font-size:16px;color:var(--ink)}
.week button i{width:18px;height:4px;border-radius:2px;display:block}
.week button em{position:absolute;top:7px;right:calc(50% - 15px);width:6px;height:6px;border-radius:50%;background:var(--acc)}
.minis{display:flex;gap:10px}
.minis .card{flex:1;margin:0;cursor:pointer}
.heads{display:flex;flex:none}
.heads>*+*{margin-left:-10px}
svg.face,img.face{flex:none;border-radius:50%;display:block}
img.face{object-fit:cover}
#back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;z-index:21;transform:translateY(105%);transition:transform .22s;max-width:560px;margin:0 auto}
body.sheet #back{opacity:1;pointer-events:auto}
body.sheet #sheet{transform:none}
#sheet h3{margin:0 0 6px;font-size:19px;font-weight:800}
#sheet .card{background:var(--card2)}
label.f{display:block;margin:12px 0 0;font-size:13px;color:var(--mut);font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:0;border-radius:14px;background:var(--card2);margin-top:5px;color:var(--ink)}
#sheet input,#sheet select,#sheet textarea{background:var(--bg)}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
input[type=color]{height:44px;padding:4px}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{border:0;background:var(--card);border-radius:99px;padding:6px 14px 6px 6px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--mut);display:flex;align-items:center;gap:8px}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--card);border-radius:99px;padding:4px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:99px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
#sheet .seg{background:var(--bg)}
.catbar{height:8px;border-radius:4px;background:var(--acc);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tiles .card{margin:0;padding:14px}
.tiles .v{font-size:17px;font-weight:800;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-t{font-weight:800;margin:2px 0 2px}
.ring{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ring>div{width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.on{opacity:1}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
img.full{width:100%;border-radius:14px;margin-top:10px}
/* premier lancement */
#who{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;transition:opacity .35s}
#who.out{opacity:0;pointer-events:none}
#who h1{margin:0;font-size:30px;font-weight:800}
#who .opts{display:flex;gap:18px;margin-top:26px}
#who .opts button{border:0;background:var(--card);border-radius:28px;padding:20px 18px 16px;width:150px;display:flex;flex-direction:column;align-items:center;gap:12px;font:inherit;font-size:18px;font-weight:800;color:var(--ink);cursor:pointer;transition:transform .2s}
#who .opts button:active{transform:scale(.95)}
/* documents */
.doc{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:16px;background:var(--card2)}
.doc .ico{width:42px;height:42px;border-radius:12px;background:rgba(252,165,165,.18);color:#FCA5A5;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.doc .grow{flex:1;min-width:0}
.doc .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc.add{border:2px dashed var(--card2);background:transparent;cursor:pointer;color:var(--mut);font-weight:700;justify-content:center;width:100%;font:inherit}
.doc input[type=file]{display:none}
.nhead{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card2);color:var(--mut);font-weight:800;flex:none;border:2px dashed #5B6178;box-sizing:border-box}
/* choix de couleur des têtes */
.headbtn{position:relative;border:0;background:none;padding:0;border-radius:50%;cursor:pointer;flex:none;transition:transform .15s}
.headbtn:active{transform:scale(.94)}
.headbtn .pen{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}
.swatches button{aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;transition:transform .15s}
.swatches button.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.swatches button:active{transform:scale(.9)}
/* dépenses récurrentes */
.sw{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:16px;margin-top:14px;cursor:pointer}
.sw .grow{flex:1}
.tog{width:50px;height:30px;border-radius:99px;background:var(--card2);position:relative;flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:left .3s cubic-bezier(.34,1.32,.5,1),background .25s}
.sw.on .tog{background:#86EFAC}
.sw.on .tog::after{left:23px;background:#1D2135}
.sw .more{display:none;font-size:13px;color:var(--mut);margin-top:2px}
.sw.on .more{display:block}
.rec{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.rec::-webkit-scrollbar{display:none}
.rc{flex:none;width:138px;background:var(--card);border-radius:18px;padding:12px;cursor:pointer;border:0;text-align:left;color:var(--ink);font:inherit}
.rc b{display:block;font-size:17px;margin-top:8px}
.rc .l{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.rc.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:2px dashed var(--card2);color:var(--mut);font-weight:700;font-size:13px}
.rc.add span{font-size:24px;line-height:1}
.rbadge{display:inline-block;font-size:11px;font-weight:800;color:#86EFAC;background:rgba(134,239,172,.15);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.vts{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.vt{border:0;border-radius:12px;color:#1D2135;font:inherit;font-weight:800;font-size:15px;padding:6px 0;line-height:1.1;cursor:pointer}
.vt.vn{background:var(--card2);color:var(--mut);box-shadow:inset 0 0 0 2px #5B6178}
.vt small{display:block;font-size:10px;font-weight:600;opacity:.75}
.vbar{display:flex;gap:2px;height:8px}
.vbar i{flex:1;border-radius:3px;display:block}
.profile{display:flex;align-items:center;gap:14px;margin:6px 0}
</style>
</head>
<body>
<header><div><div class="sub" id="sub"></div><h1 id="title">Aujourd'hui</h1></div><button class="me" id="me" aria-label="Qui utilise ce téléphone" onclick="go('plus');sub='reg';render()"></button></header>
<main id="main"></main>
<button class="fab" id="fab" style="display:none">+</button>
<nav id="nav" class="slider" data-k="nav">
  <button data-t="today" aria-label="Accueil"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg><span>Accueil</span></button>
  <button data-t="cal" aria-label="Calendrier"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendrier</span></button>
  <button data-t="dep" aria-label="Dépenses"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 6.5A7 7 0 1 0 17 17.5M4 10h9M4 14h9"/></svg><span>Dépenses</span></button>
  <button data-t="kids" aria-label="Enfants"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 14.3c3 .2 5.5 2.6 5.5 5.7"/></svg><span>Enfants</span></button>
  <button data-t="plus" aria-label="Plus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>Plus</span></button>
</nav>
<div id="back" onclick="backdrop()"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const uid=()=>Math.random().toString(36).slice(2,10);
const JC=['dim','lun','mar','mer','jeu','ven','sam'];
const JL=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const fmtD=s=>{const d=parse(s);return JL[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]};
const MC=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtS=s=>{const d=parse(s);return JC[d.getDay()]+'. '+d.getDate()+' '+MC[d.getMonth()]};
const fmtM=m=>{const[y,mo]=m.split('-').map(Number);return MOIS[mo-1].replace(/^./,c=>c.toUpperCase())+' '+y};
const fmtE=n=>(Math.round(n*100)/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const today=()=>ymd(new Date());
const curMonth=()=>today().slice(0,7);
const addM=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}

/* ---------- vacances scolaires (zone C, repli si l'API n'est pas joignable) ----------
   s = premier jour sans classe, e = jour de reprise (exclu) */
const VAC_C=[
 {n:'Toussaint',s:'2026-10-17',e:'2026-11-02'},
 {n:'Noël',s:'2026-12-19',e:'2027-01-04'},
 {n:'Hiver',s:'2027-02-06',e:'2027-02-22'},
 {n:'Printemps',s:'2027-04-03',e:'2027-04-19'},
 {n:"Pont de l'Ascension",s:'2027-05-06',e:'2027-05-10'},
 {n:'Été',s:'2027-07-03',e:'2027-09-01'}
];
const EV_TYPES={sport:'🏆 Sport',spectacle:'🎭 Spectacle',anniv:'🎂 Anniversaire',ecole:'🏫 École',sante:'🩺 Santé',autre:'📌 Autre'};
const CATS={ecole:'🏫 École',sport:'⚽ Sport & activités',sante:'🩺 Santé',vetements:'👕 Vêtements',loisirs:'🎡 Loisirs',cantine:'🍽️ Cantine / garde',aide:'🤝 Aide (CAF…)',autre:'📦 Autre'};

/* ---------- données ---------- */
const KEY='coparent_v1';
function defaults(){
  const kids=[{id:'c1',name:'Enfant 1',color:'#86EFAC'},{id:'c2',name:'Enfant 2',color:'#F9A8D4'}];
  return{
    settings:{v2:true,me:'A',parents:{A:{name:'Papa',color:'#7DD3FC'},B:{name:'Maman',color:'#FDBA74'}},weekendRef:'2026-11-20',weekendParent:'A',switchHour:18,zone:'Zone C'},
    children:kids,overrides:[],events:[],expenses:[],months:{},
    log:[],vacCache:{},vacSplit:{},recurring:[]
  };
}
function load(){
  const d=defaults();
  try{const r=localStorage.getItem(KEY);if(r){const j=JSON.parse(r);const s=Object.assign({},d,j);s.settings=Object.assign({},d.settings,j.settings||{});
    if(!j.settings||!j.settings.v2){s.settings.v2=true;const P=s.settings.parents;if(P.A.color==='#2563eb')P.A.color='#7DD3FC';if(P.B.color==='#db2777')P.B.color='#FDBA74'}
    s.children.forEach((c,i)=>{if(!c.color)c.color=['#86EFAC','#F9A8D4','#C4B5FD','#FDE68A'][i%4]});
    (s.expenses||[]).forEach(e=>delete e.photo);
    s.children.forEach(c=>{if(c.size&&!c.sizeTop){c.sizeTop=c.size}delete c.size});
    return s}}catch(e){}
  return d;

/* ---------- synchronisation Google Sheets (via un script Apps Script) ----------
   Chaque élément (dépense, événement, échange…) est une ligne du tableur, avec sa date de modif.
   Le plus récent gagne, élément par élément. Réglage « Je suis » : propre à chaque téléphone. */
const SYNC_KEY='coparent_sync';
let SY=(()=>{try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return{}}})();
function saveSY(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}}
const COLS=['events','expenses','overrides','recurring','children','log'];
function hash(t){let h=5381;for(let i=0;i<t.length;i++)h=(h*33^t.charCodeAt(i))|0;return h}
function toRecords(st){
  const L={};
  for(const c of COLS)for(const x of st[c]||[]){const id=String(x.id||x.ts);L[c+'|'+id]={c,id,data:x}}
  for(const[k,v]of Object.entries(st.months||{}))L['months|'+k]={c:'months',id:k,data:v};
  for(const[k,v]of Object.entries(st.vacSplit||{}))L['vacSplit|'+k]={c:'vacSplit',id:k,data:v};
  const se=st.settings;L['settings|shared']={c:'settings',id:'shared',data:{parents:se.parents,weekendRef:se.weekendRef,weekendParent:se.weekendParent,switchHour:se.switchHour,zone:se.zone}};
  return L;
}
function fromRecords(L){
  for(const c of COLS)S[c]=[];S.months={};S.vacSplit={};
  for(const r of Object.values(L)){
    if(COLS.includes(r.c))S[r.c].push(r.data);
    else if(r.c==='months')S.months[r.id]=r.data;
    else if(r.c==='vacSplit')S.vacSplit[r.id]=r.data;
    else if(r.c==='settings')Object.assign(S.settings,r.data);
  }
  S.children.sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  S.log.sort((a,b)=>b.ts-a.ts);
}
function markLocal(L,M){
  const now=Date.now();
  for(const k in L){const h=hash(JSON.stringify(L[k].data)),m=M[k];if(!m||m.del||m.h!==h)M[k]={c:L[k].c,id:L[k].id,u:now,h,dirty:1}}
  for(const k in M)if(!L[k]&&!M[k].del)M[k]={c:M[k].c,id:M[k].id,u:now,h:0,del:1,dirty:1};
}
let syncing=false,syncAgain=false,syncT=null;
function schedSync(){if(!SY.url)return;clearTimeout(syncT);syncT=setTimeout(sync,1200)}
async function sync(){
  if(!SY.url||!SY.secret)return;
  if(syncing){syncAgain=true;return}
  syncing=true;SY.busy=1;syncBadge();
  try{
    const first=!SY.last,L=toRecords(S);S.meta=first?{}:(S.meta||{});const M=S.meta;
    let changes=[];
    if(!first){markLocal(L,M);changes=Object.entries(M).filter(([k,m])=>m.dirty).map(([k,m])=>({k,c:m.c,id:m.id,u:m.u,del:m.del?1:0,d:m.del?'':JSON.stringify(L[k].data)}))}
    const res=await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:SY.secret,changes})});
    const j=await res.json();
    if(!j.ok)throw new Error(j.error==='secret'?'Code secret incorrect':j.error||'Erreur du script');
    changes.forEach(c=>{if(M[c.k]&&M[c.k].u===c.u)delete M[c.k].dirty});
    if(first&&!j.rows.length){
      // tableur vide : ce téléphone l'initialise avec ses données
      SY.last=Date.now();saveSY();syncing=false;return sync();
    }
    let changed=false;
    for(const r of j.rows){
      const m=M[r.k];
      if(!m||r.u>m.u){changed=true;
        if(r.del){delete L[r.k];M[r.k]={c:r.c,id:r.id,u:r.u,h:0,del:1}}
        else{L[r.k]={c:r.c,id:r.id,data:JSON.parse(r.d)};M[r.k]={c:r.c,id:r.id,u:r.u,h:hash(r.d)}}}
    }
    if(first){const keys=new Set(j.rows.map(r=>r.k));for(const k in L)if(!keys.has(k))delete L[k];changed=true}
    if(changed){fromRecords(L);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!document.body.classList.contains('sheet'))render()}
    else try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    SY.last=Date.now();SY.err='';
  }catch(e){SY.err=String(e.message||e).includes('fetch')?'Pas de connexion au script':String(e.message||e)}
  syncing=false;delete SY.busy;saveSY();syncBadge();
  if(syncAgain){syncAgain=false;sync()}
}
function syncBadge(){const m=$('#me');if(m)m.dataset.sync=!SY.url?'':SY.err?'err':SY.busy?'busy':'ok';const st=$('#syncst');if(st)st.innerHTML=syncText()}
function syncText(){
  if(!SY.url)return 'Non connecté';
  if(SY.err)return `<span style="color:#FCA5A5">⚠ ${esc(SY.err)}</span>`;
  if(SY.busy)return 'Synchronisation…';
  if(!SY.last)return 'En attente…';
  const s=Math.round((Date.now()-SY.last)/1000);
  return `<span style="color:#86EFAC">●</span> À jour · ${s<60?'il y a quelques secondes':s<3600?'il y a '+Math.round(s/60)+' min':'le '+fmtS(ymd(new Date(SY.last)))}`;
}
function connectSync(url,secret){
  url=(url||'').trim();secret=(secret||'').trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url))return toast('Adresse du script invalide (doit finir par /exec)');
  if(!secret)return toast('Code secret requis');
  SY={url,secret};saveSY();toast('Connexion…');sync().then(()=>{render();toast(SY.err?SY.err:'Synchronisé ✓')});
}

/* ---------- garde ----------
   On raisonne par nuit : la nuit du jour J = qui a les enfants de J à 18h jusqu'à J+1 18h.
   lun, mar → A ; mer, jeu → B ; ven, sam, dim → week-end alterné */
function nightParent(s){
  for(const o of S.overrides) if(s>=o.from&&s<=o.to) return{p:o.parent,chg:true};
  const vp=vacParent(s);if(vp)return{p:vp,vac:true};
  const w=parse(s).getDay();
  if(w===1||w===2) return{p:'A'};
  if(w===3||w===4) return{p:'B'};
  const fri=addD(s,w===5?0:w===6?-1:-2);
  const weeks=Math.round((parse(fri)-parse(S.settings.weekendRef))/864e5/7);
  const even=((weeks%2)+2)%2===0;
  return{p:even?S.settings.weekendParent:other(S.settings.weekendParent)};
}
function holderAt(date){
  const t=ymd(date);
  return date.getHours()<S.settings.switchHour?nightParent(addD(t,-1)).p:nightParent(t).p;
}
function nextSwitch(now=new Date()){
  const cur=holderAt(now);const t=ymd(now);
  const start=now.getHours()<S.settings.switchHour?t:addD(t,1);
  for(let i=0;i<90;i++){const s=addD(start,i);const p=nightParent(s).p;if(p!==cur)return{date:s,to:p}}
  return null;
}

/* ---------- vacances ---------- */
function VAC(){const c=S.vacCache&&S.vacCache[S.settings.zone];return c&&c.length?c:(S.settings.zone==='Zone C'?VAC_C:[])}
const vacOf=s=>VAC().find(v=>s>=v.s&&s<v.e);
function vEmoji(n){const t=String(n).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return /toussaint/.test(t)?'🍂':/noel/.test(t)?'🎄':/hiver/.test(t)?'❄️':/printemps|paques/.test(t)?'🌸':/ascension|pont/.test(t)?'🌤️':/ete/.test(t)?'☀️':'🏖️'}
/* Répartition : nuits du 1er jour de vacances jusqu'à la veille de la reprise.
   modes : normal (rythme habituel), AB (1re moitié A, 2e B), BA, A (tout), B (tout) */
const SPLITS={normal:'Rythme normal',AB:'1re ½ PA · 2e ½ PB',BA:'1re ½ PB · 2e ½ PA',A:'Tout chez PA',B:'Tout chez PB',custom:'Dates personnalisées'};
const getSplit=v=>{const x=(S.vacSplit||{})[v.s];return x&&typeof x==='object'?x:{mode:x||'normal'}};
const segsOf=v=>(getSplit(v).segs||[]).slice().sort((a,b)=>a.from.localeCompare(b.from));
const splitLabel=k=>SPLITS[k].replace(/PA/g,S.settings.parents.A.name).replace(/PB/g,S.settings.parents.B.name);
function vacMid(v){const n=Math.round((parse(v.e)-parse(v.s))/864e5);return addD(v.s,Math.floor(n/2))}
function vacParent(s){
  const v=vacOf(s);if(!v)return null;
  const m=getSplit(v).mode;
  if(m==='custom'){const x=getSplit(v);if(x.nights)return x.nights[s]||'N';const sg=segsOf(v);let p=sg[0]?.p||'N';for(const y of sg)if(y.from<=s)p=y.p;return p}
  if(m==='A'||m==='B')return m;
  if(m==='AB'||m==='BA'){const first=s<vacMid(v);return m==='AB'?(first?'A':'B'):(first?'B':'A')}
  return 'N'; // non réparti : statut neutre
}
const nightsOf=v=>{const o=[];for(let d=v.s;d<v.e;d=addD(d,1))o.push(d);return o};
function vacRuns(v){const runs=[];for(const d of nightsOf(v)){const p=nightParent(d).p;const r=runs[runs.length-1];if(r&&r.p===p)r.to=d;else runs.push({p,from:d,to:d})}return runs}
function vacSummary(v,draft){
  const n=nightsOf(v),cnt={A:0,B:0,N:0};
  const bars=n.map(d=>{const p=draft?draft[d]:nightParent(d).p;cnt[p]++;return `<i style="background:${col(p)}"></i>`}).join('');
  return `<div class="vbar">${bars}</div><div class="row sp mut" style="margin-top:8px"><span>${fmtS(v.s)}</span><span class="row" style="gap:8px">${['A','B','N'].filter(p=>cnt[p]).map(p=>`<span class="row" style="gap:4px">${head(p,20)}${cnt[p]}</span>`).join('')}</span><span>${fmtS(addD(v.e,-1))}</span></div>`;
}
const isNeutral=v=>nightsOf(v).every(d=>nightParent(d).p==='N');
const PRESETS=[['AB','½ PA → PB'],['BA','½ PB → PA'],['A','Tout PA'],['B','Tout PB'],['normal','Normal']];
function vacCard(v){
  const neutral=isNeutral(v);
  return `<div class="card"><div class="row sp"><b>${vEmoji(v.n)} ${esc(v.n)}</b>${neutral?'<span class="pill">Non réparti</span>':''}</div>
  <div style="margin-top:8px">${vacSummary(v)}</div>
  ${neutral?`<button class="btn full" onclick="openVacEdit('${v.s}')">À répartir</button>`:`<button class="btn full sec" onclick="openVacEdit('${v.s}')">Modifier la répartition</button>`}</div>`;
}
/* Éditeur de répartition : on travaille sur un brouillon, rien n'est enregistré avant « Valider ».
   Chaque action peut être annulée (↶), et quitter sans valider demande confirmation. */

  <div class="legend"><span>${head('A',22)}${name('A')}</span><span>${head('B',22)}${name('B')}</span><span>${head('N',22)}Non réparti</span></div>

}
function veSet(n){VE.hist.push(JSON.stringify(VE.nights));VE.nights=n;renderVacEdit()}

const tint=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`};
async function fetchVac(){
  try{
    const z=S.settings.zone;
    const since=addD(today(),-200);
    const url='https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-calendrier-scolaire/records?limit=100&where='+encodeURIComponent(`zones="${z}" and end_date>="${since}"`);
    const r=await fetch(url);if(!r.ok)return;

}

/* ---------- dépenses ---------- */
function monthStats(m){
  const ex=S.expenses.filter(e=>e.date.slice(0,7)===m);
  const pA=ex.filter(e=>e.payer==='A').reduce((a,e)=>a+e.amount,0);
  const pB=ex.filter(e=>e.payer==='B').reduce((a,e)=>a+e.amount,0);
  return{ex,pA,pB,total:pA+pB,bal:(pA-pB)/2}; // bal>0 : B doit bal à A
}
function allMonths(){return[...new Set(S.expenses.map(e=>e.date.slice(0,7)))].sort().reverse()}
function globalBal(){return allMonths().filter(m=>!S.months[m]?.settled).reduce((a,m)=>a+monthStats(m).bal,0)}
function balText(b,big){
  if(Math.abs(b)<0.005) return `<div class="${big?'big':''}">✅ Vous êtes à l'équilibre</div>`;
  const debtor=b>0?'B':'A',cred=other(debtor);
  return `<div class="${big?'big':''}"><span style="color:${big?'inherit':col(debtor)}">${name(debtor)}</span> doit <b>${fmtE(Math.abs(b))}</b> à ${name(cred)}</div>`;
}

/* ---------- dépenses récurrentes ----------
   Un modèle {label, amount, payer, cat, child, day, start} crée tout seul la dépense
   de chaque mois, le jour choisi, dès que ce jour est arrivé. */
const dim=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
function genRecurring(){
  const t=today(),cm=curMonth();let changed=false;
  for(const r of S.recurring||[]){
    for(let m=r.start;m<=cm;m=addM(m,1)){
      if((r.skips||[]).includes(m))continue;
      if(S.expenses.some(e=>e.recurId===r.id&&e.date.slice(0,7)===m))continue;
      const date=m+'-'+pad(Math.min(r.day,dim(m)));
      if(date>t)continue;
      S.expenses.push({id:r.id+'-'+m,label:r.label,amount:r.amount,date,payer:r.payer,cat:r.cat,child:r.child,recurId:r.id});
      if(S.months[m]?.settled)S.months[m]={settled:false};
      changed=true;
    }
  }
  if(changed)save();
}
const recTotal=()=>(S.recurring||[]).reduce((a,r)=>a+r.amount,0);
function nextRecDate(r){const t=today();let m=curMonth();for(let i=0;i<2;i++,m=addM(m,1)){const d=m+'-'+pad(Math.min(r.day,dim(m)));if(d>t||!S.expenses.some(e=>e.recurId===r.id&&e.date.slice(0,7)===m))return d}return m+'-'+pad(r.day)}
function openRecur(id){
  const r=S.recurring.find(x=>x.id===id);if(!r)return;

/* ---------- indicateur glissant ---------- */
const lastInd={};
function navTarget(el,on){
  const btns=[...el.querySelectorAll(':scope>button')],pad=parseFloat(getComputedStyle(el).paddingLeft)||0,gap=2;
  const W=el.clientWidth-pad*2-gap*(btns.length-1),tot=btns.reduce((a,b)=>a+(b===on?2.4:1),0);
  let l=pad;for(const b of btns){const w=W*(b===on?2.4:1)/tot;if(b===on)return{l,t:pad,w,h:el.clientHeight-pad*2};l+=w+gap}
}
function placeInd(el){
  const k=el.dataset.k||'x';let ind=el.querySelector(':scope>.ind');const fresh=!ind;
  if(fresh){ind=document.createElement('i');ind.className='ind';el.prepend(ind)}
  const on=el.querySelector(':scope>.on');if(!on){ind.style.opacity=0;return}
  const r=el.tagName==='NAV'?navTarget(el,on):{l:on.offsetLeft,t:on.offsetTop,w:on.offsetWidth,h:on.offsetHeight};
  const prev=lastInd[k];
  if(fresh){ind.style.transition='none';const f=prev||r;Object.assign(ind.style,{left:f.l+'px',top:f.t+'px',width:f.w+'px',height:f.h+'px'});ind.offsetWidth;ind.style.transition=''}
  Object.assign(ind.style,{left:r.l+'px',top:r.t+'px',width:r.w+'px',height:r.h+'px',opacity:1});
  lastInd[k]=r;
}
function sliders(){document.querySelectorAll('.slider').forEach(placeInd)}

    const evs=S.events.filter(e=>e.date===s);
    cells+=`<button class="d ${d.getMonth()!==m-1?'out':''} ${v?'vac':''} ${s===t?'today':''}" ${v?`style="background:${tint(col(np.p),.2)}"`:''} onclick="openDay('${s}')">

  }

  const rec=e.recurId&&S.recurring.find(r=>r.id===e.recurId);
  openSheet(`<h3>${id?'Modifier la':'Nouvelle'} dépense</h3>
  <label class="f">Libellé<input id="x_l" value="${esc(e.label)}" placeholder="Ex. Licence de foot"></label>
  <div class="two"><label class="f">Montant (€)<input id="x_a" type="number" inputmode="decimal" step="0.01" value="${e.amount??''}"></label><label class="f">Date<input type="date" id="x_d" value="${e.date}"></label></div>
  <label class="f" id="x_pl">${e.amount<0?'Perçue par':'Payé par'}</label><div class="seg slider" id="x_p" data-k="payer">${['A','B'].map(p=>`<button class="${e.payer===p?'on':''}" data-v="${p}" onclick="segPick(this)">${name(p)}</button>`).join('')}</div>
  <label class="f">Catégorie<select id="x_c">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${e.cat===k?'selected':''}>${v}</option>`).join('')}</select></label>
  <label class="f">Pour<select id="x_k"><option value="all">Les deux</option>${S.children.map(c=>`<option value="${c.id}" ${e.child===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
  <div class="mut" style="margin-top:8px" id="x_halfl">${halfText(e.amount)}</div>
  <div class="mut" style="margin-top:4px;font-size:12px">Une aide reçue (CAF…) ? Mets un montant négatif, ex. −120.</div>
  ${id?(rec?`<div class="sw on" onclick="openRecur('${rec.id}')"><div class="grow"><b>↻ Dépense mensuelle</b><div class="more">Ici tu modifies seulement ce mois. Touche pour gérer la récurrence.</div></div><span style="font-size:20px;color:var(--mut)">›</span></div>`:'')
    :`<div class="sw ${recur?'on':''}" id="x_rec" onclick="toggleSw(this)"><div class="grow"><b>↻ Tous les mois</b><div class="more">Ajoutée automatiquement le <span id="x_day">${parseInt(e.date.slice(8))}</span> de chaque mois</div></div><span class="tog"></span></div>`}
  <button class="btn full" onclick="saveExp('${id||''}')">Enregistrer</button>
  ${id?`<button class="btn full dan" onclick="delExp('${id}')">Supprimer</button>`:''}`);
  $('#x_a').oninput=ev=>{const v=parseFloat(String(ev.target.value).replace(',','.'));$('#x_halfl').textContent=halfText(v);$('#x_pl').textContent=v<0?'Perçue par':'Payé par';if(v<0&&$('#x_c').value!=='aide'){$('#x_c').value='aide'}};
  $('#x_d').onchange=ev=>{const x=$('#x_day');if(x&&ev.target.value)x.textContent=parseInt(ev.target.value.slice(8))};
}
function halfText(v){return !v?'Répartition 50/50 : chacun paie la moitié.':v<0?`Aide partagée 50/50 : ${fmtE(-v/2)} pour chacun.`:`Répartition 50/50 : chacun paie ${fmtE(v/2)}.`}
function segPick(b){b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));placeInd(b.parentNode)}
const segVal=id=>document.querySelector('#'+id+' .on')?.dataset.v;
function saveExp(id){
  const a=parseFloat(String(val('x_a')).replace(',','.'));
  const o={label:val('x_l'),amount:Math.round(a*100)/100,date:val('x_d'),payer:segVal('x_p'),cat:val('x_c'),child:val('x_k')};
  if(!o.label||!a||!o.date)return toast('Libellé, montant et date requis');
  if(!id&&$('#x_rec')?.classList.contains('on')){
    S.recurring=S.recurring||[];
    const r={id:uid(),label:o.label,amount:o.amount,payer:o.payer,cat:o.cat,child:o.child,day:parseInt(o.date.slice(8)),start:o.date.slice(0,7),skips:[]};
    S.recurring.push(r);genRecurring();
    depM=o.date.slice(0,7);closeSheet();commit(`a ajouté la dépense mensuelle « ${o.label} » ${fmtE(o.amount)} (le ${r.day} de chaque mois)`);return;
  }
  if(id)Object.assign(S.expenses.find(x=>x.id===id),o);else S.expenses.push({id:uid(),...o});
  const m=o.date.slice(0,7);let extra='';
  if(S.months[m]?.settled){S.months[m]={settled:false};extra=' (mois rouvert)'}
  depM=m;closeSheet();commit(`${id?'a modifié':'a ajouté'} la dépense « ${o.label} » ${fmtE(o.amount)}${extra}`);
}
function delExp(id){const e=S.expenses.find(x=>x.id===id);askConfirm(`Supprimer « ${e.label} » (${fmtE(e.amount)})${e.recurId?' pour ce mois':''} ?`,()=>{S.expenses=S.expenses.filter(x=>x.id!==id);const r=e.recurId&&S.recurring.find(x=>x.id===e.recurId);if(r){r.skips=r.skips||[];r.skips.push(e.date.slice(0,7))}commit(`a supprimé la dépense « ${e.label} »`)})}
function settle(m){const s=monthStats(m);askConfirm(`Confirmer que ${fmtM(m)} est réglé ?`,()=>{S.months[m]={settled:true,at:today(),bal:s.bal};commit(`a marqué ${fmtM(m)} comme réglé`)})}
function unsettle(m){S.months[m]={settled:false};commit(`a rouvert ${fmtM(m)}`)}

/* ---------- documents (PDF/photo) stockés dans le Google Drive du script ---------- */
async function api(body){
  const res=await fetch(SY.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:SY.secret,...body})});
  const j=await res.json();
  if(!j.ok)throw new Error(j.error==='secret'?'Code secret incorrect':j.error||'Erreur du script');
  if(body.action&&j.rows)throw new Error('le script Google doit être mis à jour');
  return j;
}
function docField(k,key,lab){
  const d=k[key];
  return `<div class="label f" style="margin-top:12px;font-size:13px;color:var(--mut);font-weight:600">${lab}</div>`+(d?
  `<div class="doc"><span class="ico">${/pdf/i.test(d.mime||d.name)?'PDF':'IMG'}</span><div class="grow"><div class="n">${esc(d.name)}</div><div class="mut">Ajouté le ${fmtS(d.at)}${d.size?' · '+Math.max(1,Math.round(d.size/1024))+' Ko':''}</div></div>
   <button class="btn sm" onclick="openDoc('${k.id}','${key}')">Ouvrir</button>
   <label class="btn sm sec" style="cursor:pointer">Remplacer<input type="file" accept="application/pdf,image/*" style="display:none" onchange="uploadDoc('${k.id}','${key}',this)"></label></div>
   <button class="btn sm dan" style="margin-top:8px" onclick="delDoc('${k.id}','${key}')">Retirer le document</button>`
  :`<label class="doc add"><input type="file" accept="application/pdf,image/*" onchange="uploadDoc('${k.id}','${key}',this)">＋ Joindre un PDF ou une photo</label>`);
}
const readB64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(f)});
async function uploadDoc(kidId,key,inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  if(!SY.url)return toast('Connecte d\'abord Google Sheets (Plus › Réglages)');
  if(f.size>8e6)return toast('Fichier trop lourd (8 Mo max)');
  toast('Envoi du document…');
  try{
    const j=await api({action:'upload',name:f.name,mime:f.type||'application/pdf',data:await readB64(f)});
    const k=kid(kidId),old=k[key];
    k[key]={id:j.id,name:f.name,mime:f.type||'application/pdf',size:f.size,at:today()};
    commit(`a ajouté le document « ${f.name} » à la fiche de ${k.name}`);toast('Document ajouté ✓');
    if(old&&old.id)api({action:'delete',id:old.id}).catch(()=>{});
  }catch(e){toast('Échec : '+(e.message.includes('fetch')?'pas de connexion':e.message))}
}
async function openDoc(kidId,key){
  const d=kid(kidId)[key];if(!d)return;
  if(!SY.url)return toast('Connecte d\'abord Google Sheets (Plus › Réglages)');
  const w=window.open('','_blank');toast('Ouverture…');
  try{
    const j=await api({action:'get',id:d.id});
    const bin=atob(j.data),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u8],{type:j.mime||d.mime}));
    if(w&&!w.closed)w.location.href=url;
    else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.download=d.name;document.body.appendChild(a);a.click();a.remove()}
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(e){if(w&&!w.closed)w.close();toast('Échec : '+(e.message.includes('fetch')?'pas de connexion':e.message))}
}
function delDoc(kidId,key){
  const k=kid(kidId),d=k[key];
  askConfirm(`Retirer « ${d.name} » ?`,()=>{delete k[key];commit(`a retiré le document « ${d.name} » de la fiche de ${k.name}`);if(SY.url)api({action:'delete',id:d.id}).catch(()=>{})});
}

  <div class="mut" style="margin-top:8px">Touche une tête pour changer sa couleur.</div></div>
  <div class="card"><div class="sec-t">Rythme de garde</div>
  <div class="mut">Lundi et mardi chez ${name('A')}, mercredi et jeudi chez ${name('B')}, un week-end sur deux (vendredi → lundi).</div>
  <label class="f">Un week-end de référence (n'importe quel jour de ce week-end)<input type="date" id="r_w" value="${st.weekendRef}"></label>
  <label class="f">Ce week-end-là, les enfants sont chez<select id="r_wp"><option value="A" ${st.weekendParent==='A'?'selected':''}>${name('A')}</option><option value="B" ${st.weekendParent==='B'?'selected':''}>${name('B')}</option></select></label>
  <label class="f">Heure de bascule<input type="number" id="r_h" min="0" max="23" value="${st.switchHour}"></label></div>
  <div class="card"><div class="sec-t">Vacances scolaires</div>
  <label class="f">Zone<select id="r_z">${['Zone A','Zone B','Zone C'].map(z=>`<option ${st.zone===z?'selected':''}>${z}</option>`).join('')}</select></label>

function saveReg(){
  const st=S.settings;
  ['A','B'].forEach(p=>{st.parents[p].name=val('r_n'+p)||st.parents[p].name});
  let w=val('r_w');if(w){const wd=parse(w).getDay();w=addD(w,wd===5?0:wd===6?-1:wd===0?-2:5-wd)}st.weekendRef=w||st.weekendRef;
  st.weekendParent=val('r_wp');st.switchHour=Math.min(23,Math.max(0,parseInt(val('r_h'))||18));
  const z=val('r_z'),zc=z!==st.zone;st.zone=z;
  commit('a modifié les réglages');toast('Réglages enregistrés');if(zc)fetchVac();
}
function vSave(){

function doExport(){
  try{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='coparentalite-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Sauvegarde téléchargée')}catch(e){copyExport()}

function copyExport(){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Copié dans le presse-papiers')).catch(()=>{openSheet(`<h3>Sauvegarde</h3><div class="mut">Sélectionne et copie ce texte.</div><textarea style="min-height:240px">${esc(JSON.stringify(S))}</textarea>`)})}
function impFile(inp){const f=inp.files[0];if(!f)return;f.text().then(doImport)}
function doImport(txt){
  try{const j=JSON.parse(txt);if(!j.settings||!j.children)throw 0;askConfirm('Remplacer toutes les données par cette sauvegarde ?',()=>{localStorage.setItem(KEY,JSON.stringify(j));S=load();commit('a importé une sauvegarde')})}
  catch(e){toast('Sauvegarde invalide')}
}

/* swipe gauche/droite sur le calendrier pour changer de mois */
